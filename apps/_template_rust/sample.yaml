# twister: scripts/app ztest <app>   (console harness, lines in order)
sample:
  name: __name__
tests:
  app.__name__.console:
    tags: [rust]
    filter: CONFIG_RUST_SUPPORTED
    platform_allow:
      - qemu_cortex_m3
    integration_platforms:
      - qemu_cortex_m3
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "__name__ on qemu_cortex_m3"
        - "total = 12"
        - "__name__: PASS"
