# the app itself as a twister test: boot on qemu, match the console (lines in this order)
sample:
  name: __name__
tests:
  app.__name__.console:
    tags: [testplan]
    timeout: 30
    platform_allow:
      - qemu_cortex_m3
      - qemu_riscv32
    integration_platforms:
      - qemu_cortex_m3
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "__name__ selftest"
        - "crc 123456789 = 0x29b1"
        - "result: PASS"
