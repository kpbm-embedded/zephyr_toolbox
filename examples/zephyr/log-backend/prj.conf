CONFIG_ZTEST=y
CONFIG_LOG=y
# immediate mode: a message reaches the backends inside the LOG_* call, so the test can check it at once
# (deferred mode, the default, hands messages to a log thread)
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
