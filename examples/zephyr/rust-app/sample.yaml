# twister: scripts/app ztest rust-app   (console harness: the lines below, in order)
# needs 32_17_embedded_rust (Rust toolchain) and scripts/app setup --only rust (zephyr-lang-rust)
sample:
  name: rust-app
common:
  tags: [rust]
  filter: CONFIG_RUST_SUPPORTED
  # qemu_cortex_m3 = thumbv7m (installed in 32_17); qemu_riscv32 would need riscv32i, which 32_17 does not install
  platform_allow:
    - qemu_cortex_m3
  integration_platforms:
    - qemu_cortex_m3
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "rust-app on qemu_cortex_m3"
      - "sum of squares 1..10 = 385"
      - "crc16 = 0x29b1"
      - "rust-app: PASS"
tests:
  examples.rust.app: {}
