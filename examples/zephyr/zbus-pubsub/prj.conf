CONFIG_ZTEST=y
CONFIG_ZBUS=y
# message subscribers get their own copy of every message (net_buf pool, static: no heap needed)
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=8
# observers added and removed at run time, nodes from a static pool
CONFIG_ZBUS_RUNTIME_OBSERVERS=y
CONFIG_ZBUS_RUNTIME_OBSERVERS_NODE_ALLOC_STATIC=y
CONFIG_ZBUS_RUNTIME_OBSERVERS_NODE_POOL_SIZE=2
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
