# gcovr settings for `scripts/app ztest <test> <board> --coverage` (twister runs gcovr with -r <this ID>, and gcovr
# reads this file from its root). Only this ID's own sources go into the report: the Zephyr tree under toolchain/
# is left out. include-internal-functions works around a KeyError in gcovr 8.7's internal-function filter on
# Zephyr gcov dumps (2026-10-29).
include-internal-functions = yes
exclude = toolchain/.*
